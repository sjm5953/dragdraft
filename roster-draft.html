<!doctype html>
<html lang="en" data-theme="pink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- tailwind -->
    <link href="src/output.css" rel="stylesheet" />
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />
    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/4.0.0/uicons-solid-straight/css/uicons-solid-straight.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1"
      type="module"
    ></script>
  </head>
  <body class="overflow-hidden font-gsf">
    <!--dock-->
    <div
      class="dock dock-lg z-50 bg-base-100 border-t border-neutral-200 md:hidden"
    >
      <a href="leagues.html" class="">
        <i class="fi fi-br-trophy pt-1"></i>
        <span class="dock-label">Leagues</span>
      </a>

      <a href="stats.html">
        <i class="fi fi-br-chart-histogram pt-1"></i>
        <span class="dock-label">Stats</span>
      </a>

      <a href="trivia.html">
        <i class="fi fi-br-interrogation pt-1"></i>
        <span class="dock-label">Trivia</span>
      </a>

      <a id="profileDockLink" href="profile.html">
        <i class="fi fi-br-user pt-1"></i>
        <span class="dock-label">Profile</span>
      </a>
    </div>
    <!--main container-->
    <div class="h-screen flex flex-col">
      <!--header-->
      <div class="h-16 flex items-center px-4 justify-between">
        <div>
          <h1 class="font-black uppercase text-sm">
            <span class="text-primary">Drag</span>Draft
          </h1>
        </div>
        <div>
          <div class="dropdown dropdown-end">
            <button
              id="notificationsBtn"
              tabindex="0"
              class="btn btn-square btn-sm bg-neutral rounded-none text-base-100 relative"
            >
              <i class="fi fi-br-bell pt-1"></i>

              <span
                id="notificationCount"
                class="hidden absolute -top-2 -right-2 min-w-5 h-5 px-1 bg-primary text-neutral text-[10px] font-black flex items-center justify-center rounded-full"
              >
                0
              </span>
            </button>

            <div
              tabindex="0"
              class="dropdown-content z-50 mt-2 w-80 bg-base-100 shadow-xl border border-neutral-200"
            >
              <div class="p-3 border-b border-neutral-200">
                <h2 class="font-black uppercase text-sm">Notifications</h2>
              </div>

              <div id="notificationsList" class="max-h-96 overflow-y-auto">
                <div class="p-4 text-sm opacity-60">Loading...</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!--body-->
      <div
        class="flex-1 overflow-y-auto px-4 mt-4 w-full md:max-w-3xl md:mx-auto pb-20"
      >
        <!--page header-->
        <div class="flex items-center gap-4">
          <a
            id="backToLeagueBtn"
            href="leagues.html"
            class="btn btn-square btn-xs bg-base-100 text-neutral border-neutral shadow-none"
          >
            <i class="fi fi-br-angle-left pt-1"></i>
          </a>

          <h1 id="draftPageTitle" class="font-black uppercase text-2xl">
            Roster Draft
          </h1>
        </div>
        <div class="mt-6">
          <div class="flex items-center justify-between">
            <h2 class="font-black uppercase text-lg">Available Queens</h2>

            <span
              id="slotCount"
              class="text-xs uppercase opacity-50 font-black"
            >
              0 / 0 selected
            </span>
          </div>

          <div id="queenGrid" class="grid grid-cols-3 gap-3 mt-3 pb-10"></div>

          <div id="toast" class="toast toast-bottom toast-center hidden z-50">
            <div class="alert bg-neutral text-base-100 rounded-none border-0">
              <span id="toastText" class="font-black uppercase text-xs">
                You have filled your slots already.
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const AIRTABLE_TOKEN =
        "patVP0kfX1Ch4uKWl.896c99262e92660d8728aba045b4e1cb0a3fdebd80cf3310df67f930323d66d6";
      const BASE_ID = "appWSxdKSUmtWAIAw";

      const TABLES = {
        leagues: "Leagues",
        leagueMembers: "League Members",
        users: "Users",
        seasons: "Seasons",
        episodes: "Episodes",
        seasonContestants: "Season Contestants",
        queens: "Queens",
        rosterAssignments: "Roster Assignments",
        notifications: "notifications",
      };

      const headers = {
        Authorization: `Bearer ${AIRTABLE_TOKEN}`,
        "Content-Type": "application/json",
      };

      const currentUser = JSON.parse(localStorage.getItem("dragdraft_user"));
      const params = new URLSearchParams(window.location.search);
      const leagueId = params.get("league");

      const queenGrid = document.querySelector("#queenGrid");
      const slotCount = document.querySelector("#slotCount");
      const toast = document.querySelector("#toast");
      const toastText = document.querySelector("#toastText");

      let currentLeague = null;
      let currentLeagueMember = null;
      let activeSeason = null;
      let nextEpisodeId = null;
      let seasonContestants = [];
      let activeAssignments = [];
      let allRosterAssignments = [];
      let selectedQueenIds = [];
      let availableSlots = 0;

      if (!currentUser?.id) {
        window.location.href = "auth.html";
      }

      function airtableUrl(tableName, extra = "") {
        return `https://api.airtable.com/v0/${BASE_ID}/${encodeURIComponent(tableName)}${extra}`;
      }

      async function getRecordById(tableName, id) {
        const res = await fetch(airtableUrl(tableName, `/${id}`), { headers });
        const data = await res.json();

        if (!res.ok) {
          console.error(data);
          return null;
        }

        return data;
      }

      async function createRecord(tableName, fields) {
        const res = await fetch(airtableUrl(tableName), {
          method: "POST",
          headers,
          body: JSON.stringify({ fields }),
        });

        const data = await res.json();

        if (!res.ok) {
          console.error(data);
          throw new Error(`Could not create record in ${tableName}`);
        }

        return data;
      }

      async function updateRecord(tableName, id, fields) {
        const res = await fetch(airtableUrl(tableName, `/${id}`), {
          method: "PATCH",
          headers,
          body: JSON.stringify({ fields }),
        });

        const data = await res.json();

        if (!res.ok) {
          console.error(data);
          throw new Error(`Could not update record in ${tableName}`);
        }

        return data;
      }

      function formatPoints(value) {
        return Number(value || 0);
      }

      async function getQueenForSeasonContestant(seasonContestant) {
        const queenId = seasonContestant.fields.queen?.[0];

        if (!queenId) {
          return {
            name: "Unknown queen",
            image_url: "",
          };
        }

        const queen = await getRecordById(TABLES.queens, queenId);

        return {
          name: queen?.fields?.name || "Unknown queen",
          image_url: queen?.fields?.image_url || "",
        };
      }

      async function loadLeagueContext() {
        currentLeague = await getRecordById(TABLES.leagues, leagueId);

        if (!currentLeague) {
          queenGrid.innerHTML = `<div class="bg-red-100 text-red-700 p-4 col-span-2">League not found.</div>`;
          return;
        }
        document.querySelector("#draftPageTitle").textContent =
          currentLeague.fields.name || "Roster Draft";

        document.querySelector("#backToLeagueBtn").href =
          `league-detail.html?league=${currentLeague.id}`;

        const leagueMemberIds = currentLeague.fields.league_members || [];

        for (const id of leagueMemberIds) {
          const member = await getRecordById(TABLES.leagueMembers, id);

          if (member?.fields?.member?.[0] === currentUser.id) {
            currentLeagueMember = member;
            break;
          }
        }

        if (!currentLeagueMember) {
          queenGrid.innerHTML = `
  <div class="bg-red-100 text-red-700 p-4 col-span-2">
    Could not find your League Members record for this league.
  </div>
`;
          return;
        }

        const activeSeasonId = currentLeague.fields.active_season?.[0];

        if (!activeSeasonId) {
          queenGrid.innerHTML = `<div class="bg-neutral-100 p-4 col-span-2">No active season set.</div>`;
          return;
        }

        activeSeason = await getRecordById(TABLES.seasons, activeSeasonId);

        const episodeIds = activeSeason?.fields?.episodes || [];

        const episodes = [];

        for (const id of episodeIds) {
          const episode = await getRecordById(TABLES.episodes, id);
          if (episode) episodes.push(episode);
        }

        const now = new Date();

        const upcomingEpisodes = episodes
          .filter((episode) => {
            if (!episode.fields.air_date) return false;
            return new Date(episode.fields.air_date) > now;
          })
          .sort(
            (a, b) => new Date(a.fields.air_date) - new Date(b.fields.air_date),
          );

        nextEpisodeId = upcomingEpisodes[0]?.id || null;

        if (!nextEpisodeId) {
          showToast("No upcoming episode found.");
        }
      }

      async function loadSeasonContestants() {
        const seasonContestantIds =
          activeSeason?.fields?.season_contestants || [];

        seasonContestants = [];

        for (const id of seasonContestantIds) {
          const seasonContestant = await getRecordById(
            TABLES.seasonContestants,
            id,
          );

          if (!seasonContestant) continue;

          const queen = await getQueenForSeasonContestant(seasonContestant);

          seasonContestants.push({
            id: seasonContestant.id,
            name: queen.name,
            image_url: queen.image_url,
            points: formatPoints(seasonContestant.fields.total_season_points),
          });
        }

        seasonContestants.sort((a, b) => a.name.localeCompare(b.name));
      }

      async function loadActiveRoster() {
        const assignmentIds =
          currentLeagueMember.fields.roster_assignments || [];

        activeAssignments = [];
        allRosterAssignments = [];

        for (const id of assignmentIds) {
          const assignment = await getRecordById(TABLES.rosterAssignments, id);
          if (!assignment) continue;

          allRosterAssignments.push(assignment);

          if (assignment.fields.active === true) {
            activeAssignments.push(assignment);
          }
        }

        availableSlots = Number(
          currentLeagueMember.fields.available_slots || 0,
        );

        selectedQueenIds = activeAssignments
          .map((assignment) => assignment.fields.queen?.[0])
          .filter(Boolean)
          .slice(0, availableSlots);
      }

      function showToast(message) {
        toastText.textContent = message;
        toast.classList.remove("hidden");

        setTimeout(() => {
          toast.classList.add("hidden");
        }, 1800);
      }

      function updateSlotCount() {
        slotCount.textContent = `${selectedQueenIds.length} / ${availableSlots} selected`;
      }

      function renderQueenGrid() {
        queenGrid.innerHTML = "";
        updateSlotCount();

        if (!seasonContestants.length) {
          queenGrid.innerHTML = `
      <div class="bg-neutral-100 p-4 col-span-2 text-sm opacity-60">
        No queens found.
      </div>
    `;
          return;
        }

        seasonContestants.forEach((queen) => {
          const isSelected = selectedQueenIds.includes(queen.id);

          const card = document.createElement("button");
          card.type = "button";
          card.dataset.seasonContestantId = queen.id;

          card.className = `
      text-left bg-neutral-100 p-3 border transition
      ${isSelected ? "border-primary border-2" : "border-transparent"}
    `;

          card.innerHTML = `
      ${
        queen.image_url
          ? `<img src="${queen.image_url}" class="w-full aspect-square object-cover bg-neutral-300" />`
          : `<div class="w-full aspect-square bg-neutral-300"></div>`
      }

      <h3 class="font-black uppercase text-xs mt-2 leading-tight">
        ${queen.name}
      </h3>
    `;

          card.addEventListener("click", () => toggleQueenSelection(queen.id));

          queenGrid.appendChild(card);
        });
      }

      async function toggleQueenSelection(seasonContestantId) {
        const isSelected = selectedQueenIds.includes(seasonContestantId);

        if (isSelected) {
          selectedQueenIds = selectedQueenIds.filter(
            (id) => id !== seasonContestantId,
          );
          renderQueenGrid();

          const assignment = activeAssignments.find(
            (assignment) => assignment.fields.queen?.[0] === seasonContestantId,
          );

          if (assignment) {
            await updateRecord(TABLES.rosterAssignments, assignment.id, {
              active: false,
            });
          }

          await loadActiveRoster();
          renderQueenGrid();
          return;
        }

        if (selectedQueenIds.length >= availableSlots) {
          showToast("You have filled your slots already.");
          return;
        }

        if (!nextEpisodeId) {
          showToast("No upcoming episode found.");
          return;
        }

        selectedQueenIds.push(seasonContestantId);
        renderQueenGrid();

        const existingAssignment = allRosterAssignments.find(
          (assignment) => assignment.fields.queen?.[0] === seasonContestantId,
        );

        if (existingAssignment) {
          const existingEpisodeIds = existingAssignment.fields.episodes || [];

          await updateRecord(TABLES.rosterAssignments, existingAssignment.id, {
            active: true,
            episodes: existingEpisodeIds.includes(nextEpisodeId)
              ? existingEpisodeIds
              : [...existingEpisodeIds, nextEpisodeId],
          });
        } else {
          await createRecord(TABLES.rosterAssignments, {
            member: [currentLeagueMember.id],
            queen: [seasonContestantId],
            episodes: [nextEpisodeId],
            active: true,
          });
        }

        currentLeagueMember = await getRecordById(
          TABLES.leagueMembers,
          currentLeagueMember.id,
        );

        await loadActiveRoster();
        renderQueenGrid();
      }

      async function initializePage() {
        await loadLeagueContext();

        if (!currentLeagueMember) {
          queenGrid.innerHTML = `<div class="bg-red-100 text-red-700 p-4 col-span-2">You are not a member of this league.</div>`;
          return;
        }

        if (!activeSeason) {
          queenGrid.innerHTML = `
  <div class="bg-red-100 text-red-700 p-4 col-span-2">
    Could not load the league's active season.
  </div>
`;
          return;
        }

        await loadSeasonContestants();
        currentLeagueMember = await getRecordById(
          TABLES.leagueMembers,
          currentLeagueMember.id,
        );

        await loadActiveRoster();
        renderQueenGrid();
      }

      let currentNotifications = [];
      let notificationsMarkedRead = false;

      function updateNotificationCount(count) {
        const notificationCount = document.querySelector("#notificationCount");

        if (!notificationCount) return;

        if (!count) {
          notificationCount.classList.add("hidden");
          notificationCount.textContent = "0";
          return;
        }

        notificationCount.classList.remove("hidden");
        notificationCount.textContent = count > 9 ? "9+" : count;
      }

      function formatNotificationDate(dateString) {
        if (!dateString) return "";

        return new Date(dateString).toLocaleDateString("en-US", {
          month: "short",
          day: "numeric",
        });
      }

      function renderNotifications(notifications) {
        const notificationsList = document.querySelector("#notificationsList");

        if (!notificationsList) return;

        if (!notifications.length) {
          notificationsList.innerHTML = `
      <div class="p-4 text-sm opacity-60">
        No notifications yet.
      </div>
    `;
          return;
        }

        notificationsList.innerHTML = "";

        notifications.forEach((notification) => {
          const item = document.createElement("div");
          item.className = "p-4 border-b border-neutral-200 last:border-b-0";

          item.innerHTML = `
      <div class="flex items-start justify-between gap-3">
        <h3 class="font-black uppercase text-sm leading-tight">
          ${notification.fields.subject || "Notification"}
        </h3>

        <span class="text-[10px] uppercase opacity-50 whitespace-nowrap">
          ${formatNotificationDate(notification.fields.created_at)}
        </span>
      </div>

      <p class="text-sm opacity-70 mt-1">
        ${notification.fields.body_text || ""}
      </p>
    `;

          notificationsList.appendChild(item);
        });
      }

      async function updateRecord(tableName, id, fields) {
        const res = await fetch(airtableUrl(tableName, `/${id}`), {
          method: "PATCH",
          headers,
          body: JSON.stringify({ fields }),
        });

        const data = await res.json();

        if (!res.ok) {
          console.error(data);
          throw new Error(`Could not update ${tableName}.`);
        }

        return data;
      }

      async function getUserNotifications(userRecordId) {
        const notifications = await airtableFetch(TABLES.notifications);

        return notifications
          .filter((notification) => {
            const users = notification.fields.user || [];
            const isUnread = notification.fields.read !== true;

            return users.includes(userRecordId) && isUnread;
          })
          .sort((a, b) => {
            return (
              new Date(b.fields.created_at) - new Date(a.fields.created_at)
            );
          });
      }

      async function markNotificationsAsRead(notifications) {
        for (const notification of notifications) {
          await updateRecord(TABLES.notifications, notification.id, {
            read: true,
          });
        }
      }

      async function loadNotifications() {
        try {
          const userRecord = await getCurrentUserRecord();

          currentNotifications = await getUserNotifications(userRecord.id);

          renderNotifications(currentNotifications);
          updateNotificationCount(currentNotifications.length);
        } catch (err) {
          console.error("Could not load notifications:", err);

          const notificationsList =
            document.querySelector("#notificationsList");

          if (notificationsList) {
            notificationsList.innerHTML = `
        <div class="p-4 text-sm text-red-700 bg-red-100">
          Could not load notifications.
        </div>
      `;
          }
        }
      }

      function initializeNotifications() {
        const notificationsDropdown =
          document.querySelector(".dropdown-content");

        if (!notificationsDropdown) return;

        notificationsDropdown.addEventListener("focusin", async () => {
          if (notificationsMarkedRead || !currentNotifications.length) return;

          notificationsMarkedRead = true;

          try {
            await markNotificationsAsRead(currentNotifications);

            currentNotifications = [];
            renderNotifications([]);
            updateNotificationCount(0);
          } catch (err) {
            console.error("Could not mark notifications as read:", err);
          }
        });
      }

      initializePage();
    </script>
  </body>
</html>
